spring:
  application:
    name: booking-system

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/booking_system}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:local-development-jwt-secret-must-be-at-least-32-chars}
    expiration: ${JWT_EXPIRATION:3600000}