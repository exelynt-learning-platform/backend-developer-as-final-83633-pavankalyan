spring:
  application:
    name: booking-system

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/booking_system}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:3600000}

  seed:
    admin:
      email: ${SEED_ADMIN_EMAIL:admin@example.com}
      password: ${SEED_ADMIN_PASSWORD:Admin@12345}

    user:
      email: ${SEED_USER_EMAIL:user@example.com}
      password: ${SEED_USER_PASSWORD:User@12345}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha