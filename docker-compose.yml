services:

  postgres:
    image: postgres:16-alpine
    container_name: booking-system-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: booking_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d booking_system"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: booking-system-app
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8080:8080"

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/booking_system
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}

      SERVER_PORT: 8080

      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-secure-random-secret-key}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}

      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-change-me-admin-password}

      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-user@example.com}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-change-me-user-password}

volumes:
  postgres_data: